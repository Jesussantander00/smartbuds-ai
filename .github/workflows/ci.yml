# Comprueba cada cambio: pruebas, APK de Android y app de iPhone (sin firmar).
name: Comprobar SmartBuds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Pruebas y Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: flutter test
      - name: Compilar APK (sin modelos de voz ni claves)
        run: |
          echo '{"YOUTUBE_API_KEY":"","SUPABASE_URL":"","SUPABASE_ANON_KEY":""}' > secrets.json
          flutter build apk --debug --dart-define-from-file=secrets.json

  ios:
    name: iPhone (sin firmar)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para iPhone
        run: |
          echo '{"YOUTUBE_API_KEY":"","SUPABASE_URL":"","SUPABASE_ANON_KEY":""}' > secrets.json
          flutter build ios --release --no-codesign --dart-define-from-file=secrets.json
