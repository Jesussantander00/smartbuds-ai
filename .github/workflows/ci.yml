# Comprueba cada cambio: pruebas, APK de Android y app de iPhone (sin firmar).
#
# Ahorro de minutos (repo privado: cada minuto de macOS cuenta como 10):
# - En cada PR: solo pruebas + APK (Linux, barato).
# - iPhone (macOS): al fusionar en main, o a mano desde «Actions → Run workflow»,
#   o en un PR con la etiqueta «ios».
# - Cambios solo de documentación no gastan minutos.
# - Si subes otro commit, se cancela la revisión anterior que seguía corriendo.
name: Comprobar SmartBuds

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['docs/**', '**/*.md', 'supabase/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'supabase/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Pruebas y Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: flutter test
      - name: Compilar APK (sin modelos de voz ni claves)
        run: |
          echo '{"YOUTUBE_API_KEY":"","SUPABASE_URL":"","SUPABASE_ANON_KEY":""}' > secrets.json
          flutter build apk --debug --dart-define-from-file=secrets.json

  ios:
    name: iPhone (sin firmar)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para iPhone
        run: |
          echo '{"YOUTUBE_API_KEY":"","SUPABASE_URL":"","SUPABASE_ANON_KEY":""}' > secrets.json
          flutter build ios --release --no-codesign --dart-define-from-file=secrets.json
